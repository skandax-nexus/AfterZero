# Builds the Android APK in the cloud with GameCI, so you can get an installable game without
# building on your own PC. Setup (once): add repository secrets UNITY_LICENSE (contents of your
# Unity .ulf license file), UNITY_EMAIL and UNITY_PASSWORD. See https://game.ci/docs/github/activation
# Then: Actions tab -> "Android build" -> Run workflow. The APK appears as a downloadable artifact.
name: Android build (Unity)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk || true
          df -h

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: Library-Android-

      # Generates every scene from code, then builds the APK (AZMobileBuild.CIBuildAndroid).
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          # Unity 6 LTS version with a GameCI Android image. Keep in sync with ProjectSettings/ProjectVersion.txt.
          unityVersion: 6000.0.84f1
          targetPlatform: Android
          buildMethod: AfterZero.EditorTools.AZMobileBuild.CIBuildAndroid
          androidExportType: androidPackage

      - uses: actions/upload-artifact@v4
        with:
          name: AfterZero-FirstCycle-Android
          path: Builds/Android/*.apk
