# Builds the lightweight touch version (three.js in an Android WebView) as an installable APK.
# No secrets needed. Actions tab -> "Android build (web engine)" -> Run workflow.
name: Android build (web engine)

on:
  workflow_dispatch:
  push:
    paths: ["android-web/**"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: ./android-web/tools/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AfterZero-FirstCycle-WebEngine-APK
          path: android-web/dist/AfterZero_FirstCycle.apk
